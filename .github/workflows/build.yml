name: Build Web & APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & black-box tests (Fuzzy Mamdani)
        run: npm test

      - name: Build web
        run: npm run build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: kalibrasi-kopi-web
          path: dist

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk kalibrasi-kopi-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kalibrasi-kopi-apk
          path: kalibrasi-kopi-debug.apk
