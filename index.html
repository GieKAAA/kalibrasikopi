<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f3ef" />
    <meta name="description" content="Smart Assistant Digital Barista Handbook — resep & kalibrasi espresso dengan Logika Fuzzy Mamdani" />
    <title>Kalibrasi Kopi</title>
    <script>
      // Terapkan tema sebelum render agar tidak berkedip.
      try {
        var t = JSON.parse(localStorage.getItem('kalibrasikopi:v1') || '{}').state?.theme || 'system';
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
